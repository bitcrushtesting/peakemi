name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC 13)
            os: ubuntu-24.04
            preset: ci
            cc: gcc-13
            cxx: g++-13
          - name: macOS (AppleClang)
            os: macos-14
            preset: ci
          - name: Windows (MSVC 2022)
            os: windows-2022
            preset: ci

    steps:
      # Full history: the version comes from the nearest release tag, and a
      # shallow clone has none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libudev-dev libusb-1.0-0-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport
          cache: true

      - name: Configure, build and test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          # Widgets tests run without a display server (NFR-QUA-3).
          QT_QPA_PLATFORM: offscreen
        run: cmake --workflow --preset ${{ matrix.preset }}

      # The headless runner is the interface a build server uses, so CI drives
      # the binary it just built the way a pipeline would: a simulated run whose
      # spectrum is known to fail CISPR 32 class B must exit 1 and leave every
      # artefact behind. A run that exits 0 here means the exit-code contract
      # broke, which no unit test can catch from inside the process.
      - name: Headless smoke run
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          cli=build/ci/bin/peakemi-cli
          [ -x "$cli" ] || cli=build/ci/bin/peakemi-cli.exe

          code=0
          "$cli" --quiet --summary json \
            --limit "CISPR 32 Class B radiated 10 m (QP)" \
            --correction resources/corrections/example-antenna-factor.csv \
            --start 30M --stop 200M --points 2001 --dwell 20ms --max-peaks 3 \
            --eut "CI smoke run" --run-id "ci-${GITHUB_RUN_ID}" \
            --output-dir headless-artefacts > headless-summary.json || code=$?

          if [ "$code" -ne 1 ]; then
            echo "::error::expected exit code 1 for a failing EUT, got ${code}"
            cat headless-summary.json || true
            exit 1
          fi
          for artefact in session.peakemi.json results.csv results.json trace.csv report.pdf; do
            test -s "headless-artefacts/${artefact}" \
              || { echo "::error::missing ${artefact}"; exit 1; }
          done
          grep -q '"runId": "ci-'"${GITHUB_RUN_ID}"'"' headless-summary.json

          # --fail-on never asks a different question of the same measurement.
          "$cli" --quiet --fail-on never \
            --limit "CISPR 32 Class B radiated 10 m (QP)" \
            --start 30M --stop 60M --points 501 --dwell 20ms --max-peaks 1 > /dev/null

      - name: Upload headless artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-artefacts-${{ runner.os }}
          path: |
            headless-artefacts/
            headless-summary.json
          if-no-files-found: ignore

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ runner.os }}
          path: build/ci/Testing/**
          if-no-files-found: ignore

  static-analysis:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # clang 18 cannot parse libstdc++'s <expected> and reports every use of
      # std::expected as an unknown template, so the analyser needs a newer
      # release than Ubuntu 24.04 ships. The versioned binaries are invoked
      # directly: the runner image ships a real /usr/bin/clang-tidy, which
      # update-alternatives will not replace.
      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lsb-release wget software-properties-common gnupg \
            libgl1-mesa-dev libudev-dev libusb-1.0-0-dev
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-tidy-20 clang-format-20
          clang-tidy-20 --version
          clang-format-20 --version

      - name: Check formatting
        run: |
          # *.h.in holds CMake @VARIABLE@ placeholders, which clang-format
          # cannot parse; it is generated into a formatted header at build time.
          mapfile -t files < <(git ls-files '*.cpp' '*.h')
          clang-format-20 --dry-run --Werror "${files[@]}"

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport
          cache: true

      - name: Configure with clang-tidy
        env:
          CC: clang-20
          CXX: clang++-20
        run: |
          cmake --preset ci -DPEAKEMI_ENABLE_CLANG_TIDY=ON \
            -DPEAKEMI_CLANG_TIDY_EXE=/usr/bin/clang-tidy-20 \
            -DPEAKEMI_WARNINGS_AS_ERRORS=OFF -DPEAKEMI_BUILD_TOOLS=ON \
            -DPEAKEMI_WITH_USBTMC=ON -DPEAKEMI_WITH_VISA=ON -DPEAKEMI_WITH_PYTHON=ON

      - name: Build with clang-tidy
        run: cmake --build --preset ci
