name: Release

# Cut a release by tagging a commit on main:
#
#     git tag -a v0.2.0 -m "PeakEmi 0.2.0" && git push origin v0.2.0
#
# GitHub cannot filter tag pushes by branch, so the first job rejects tags that
# do not point at a commit contained in main. The version needs no checking
# here: the build reads it from this same tag, and is told to fail if what it
# reads is not what this workflow is releasing.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

env:
  QT_VERSION: "6.8.1"

jobs:
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${tag} does not point at a commit on main."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          case "${version}" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  package:
    name: Package ${{ matrix.name }}
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            artifact: PeakEmi-${{ needs.verify-tag.outputs.version }}-linux-x86_64.AppImage
          - name: macOS arm64
            os: macos-14
            artifact: PeakEmi-${{ needs.verify-tag.outputs.version }}-macos-arm64.dmg
          - name: Windows x64
            os: windows-2022
            artifact: PeakEmi-${{ needs.verify-tag.outputs.version }}-windows-x64.zip

    steps:
      # Full history: the build reads its version from the nearest release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 fuse libfuse2 \
            libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libudev-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport
          cache: true

      # PEAKEMI_EXPECT_VERSION makes the build fail if the version it derives
      # from the tag is not the one being released -- which is what a clone
      # that could not see the tag looks like.
      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake --preset release
          -DPEAKEMI_EXPECT_VERSION=${{ needs.verify-tag.outputs.version }}
          && cmake --build --preset release

      # A release binary that fails its own test suite never reaches a user.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/release --output-on-failure

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cmake --install build/release --prefix AppDir/usr

          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          export OUTPUT="${{ matrix.artifact }}"
          export QMAKE="${QT_ROOT_DIR}/bin/qmake"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --desktop-file AppDir/usr/share/applications/peakemi.desktop \
            --icon-file resources/peakemi.png --output appimage

      - name: Package disk image (macOS)
        if: runner.os == 'macOS'
        # The dmg target deploys Qt into the bundle, signs it, builds the image
        # and then mounts it and launches the application inside it. A bundle
        # that only works on the machine that built it fails here rather than in
        # someone's Downloads folder.
        run: |
          set -euo pipefail
          cmake --build --preset release --target dmg
          mv build/release/PeakEmi-*-macos-*.dmg "${{ matrix.artifact }}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage/PeakEmi"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/release/bin/peakemi.exe $stage
          Copy-Item README.md, tasklist.md, LICENSE $stage
          Copy-Item -Recurse resources $stage/resources
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-compiler-runtime "$stage/peakemi.exe"
          Compress-Archive -Path $stage -DestinationPath "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [verify-tag, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: PeakEmi ${{ needs.verify-tag.outputs.version }}
          prerelease: ${{ needs.verify-tag.outputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            **Pre-compliance only.** PeakEmi produces indicative engineering data.
            Results are not an accredited compliance measurement.

            | Platform | Download |
            |---|---|
            | Linux x86_64 | `PeakEmi-${{ needs.verify-tag.outputs.version }}-linux-x86_64.AppImage` |
            | macOS arm64 | `PeakEmi-${{ needs.verify-tag.outputs.version }}-macos-arm64.dmg` |
            | Windows x64 | `PeakEmi-${{ needs.verify-tag.outputs.version }}-windows-x64.zip` |

            The macOS disk image and the Windows archive are not code-signed yet
            (milestone M8), so both platforms will warn on first launch.
